{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
        {% tailwind_css %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIME OUT</title>
</head>
<body class="h-full min-h-screen bg-gradient-to-br from-black via-pink-900 to-purple-800">

    
    <div class="flex flex-col items-center justify-center min-h-screen bg-gradient-to-br from-black via-pink-900 to-purple-800">
        <h1 class="text-4xl font-bold text-white mb-4">Session Timed Out</h1>
        <p class="text-lg text-gray-300 mb-6">Your session has expired due to inactivity. Please log in again to continue.</p>
        <a href="{% url 'login' %}" class="px-6 py-3 bg-pink-500 text-white rounded-lg hover:bg-pink-600 transition duration-300">Go to Login</a>
    </div>

</body>
</html>
